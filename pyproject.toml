[project]
name = "vuln-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anna Makarudze", email = "amakarudze@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "packaging>=26.3",
    "pre-commit>=4.7.0",
    "pymongo>=4.19.0",
    "ruff>=0.17.4",
]

[project.scripts]
vuln-tracker = "vuln_tracker:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
]
