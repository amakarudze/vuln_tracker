services:
  app:
    build:
      context: .
    env_file:
      - .env
    ports:
      - 8000:8000
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"

        - action: rebuild
          path: ./pyproject.toml

        - action: rebuild
          path: ./uv.lock

        - action: rebuild
          path: ./Dockerfile
    environment:
        DBHOST: dbstorage
        DBPORT: 27017
        MONGO_DB: vulnerabilityDetector
    networks:
      - monitor-net
      
  dbstorage:
    image: mongo
    restart: always
    command: --quiet --syslog
    ports:
      - 27017:27017
    volumes:
      - dbstorage:/data/db
      - dbconfig:/data/configdb
    networks:
      - monitor-net
    
volumes:
  dbstorage:
  dbconfig:

networks:
  monitor-net:
    driver: bridge